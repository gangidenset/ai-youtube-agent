# ローカル開発専用のミドルウェア（PostgreSQL / Redis / MinIO）。
# ここに書いた認証情報は開発用の固定値で、本番では使わない（本番は各サービスの Secret 管理を使う）。
# ポートは 127.0.0.1 にだけ公開する。
name: aya

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aya
      POSTGRES_PASSWORD: aya
      POSTGRES_DB: aya
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aya -d aya"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: aya-dev
      MINIO_ROOT_PASSWORD: aya-dev-password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 開発用バケットを作成して終了する
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 aya-dev aya-dev-password && mc mb --ignore-existing local/aya-dev
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  minio-data:
